services:
  api:
    build: .
    container_name: triagem-api
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # n8n é opcional: só sobe com `docker compose --profile n8n up`
  n8n:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: triagem-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
